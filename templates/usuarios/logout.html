{% extends 'base.html' %}

{% block title %}Sesión Cerrada - Pernoctaciones{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 mt-5">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center p-5">
                <div class="mb-4">
                    <i class="bi bi-check-circle text-success" style="font-size: 4rem;"></i>
                </div>
                <h3 class="mb-3 text-secondary">Sesión Cerrada con Éxito</h3>
                <p class="text-muted mb-4">
                    Has salido del sistema de pernoctaciones de forma segura. 
                    Recuerda cerrar el navegador si estás en un equipo compartido.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary px-4">
                    <i class="bi bi-box-arrow-in-right"></i> Volver a Ingresar
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
